# One-command demo setup:
#   docker compose up --build
# then, in another shell:
#   docker compose exec ai-shield python -m ai_shield scan --target targets/vulnbot.yaml
#
# vulnbot serves the deliberately vulnerable demo agent; ai-shield is the scanner CLI,
# idling so you can `exec` into it and run scans against vulnbot over the compose network.
services:
  vulnbot:
    build: .
    command: uvicorn demo_target.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  ai-shield:
    build: .
    command: sleep infinity
    depends_on:
      - vulnbot
    volumes:
      - ./scans:/app/scans
